<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - GreenSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="static/sign_up.css">
</head>
<body>
    <!-- Sign Up Section -->
    <div class="container d-flex justify-content-center align-items-center full-height">
        <div class="bg-light p-4 rounded shadow-lg text-center" style="width: 100%; max-width: 40rem;">
            <form action="dashboard.html" method="POST">
                <i class="fas fa-user-plus fa-4x mb-3 text-success"></i>
                <h1 class="h3 mb-3 fw-bold">Sign Up for GreenSync</h1>

                <div class="input-group mb-3">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-user text-muted"></i>
                    </span>
                    <div class="form-floating flex-grow-1">
                        <input type="text" class="form-control border-start-0" name="username" id="floatingUsername" placeholder="Username" required>
                        <label for="floatingUsername">Username</label>
                    </div>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-envelope text-muted"></i>
                    </span>
                    <div class="form-floating flex-grow-1">
                        <input type="email" class="form-control border-start-0" name="email" id="floatingEmail" placeholder="Email" required>
                        <label for="floatingEmail">Email</label>
                    </div>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-lock text-muted"></i>
                    </span>
                    <div class="form-floating flex-grow-1">
                        <input type="password" class="form-control border-start-0" name="password" id="floatingPassword" placeholder="Password" required>
                        <label for="floatingPassword">Password</label>
                    </div>
                </div>
                
                <div class="input-group mb-3">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-map-marker-alt text-muted"></i>
                    </span>
                    <div class="form-floating flex-grow-1">
                        <input type="text" class="form-control border-start-0" name="postcode" id="floatingPostcode" placeholder="Postcode" required>
                        <label for="floatingPostcode">Postcode</label>
                    </div>
                </div>
                
                <button class="btn btn-success w-100 py-2" type="submit">Sign Up</button>
                <p class="mt-3 text-center">
                    <a href="index.html" class="link-primary"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
                </p>
                <hr class="my-4">
                <p class="mb-2 text-muted">&copy; GreenSync | 2025</p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
