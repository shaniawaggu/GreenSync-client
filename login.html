<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GreenSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/login.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="./javascript/login.js"></script>
</head>
<body>

    <nav class="navbar fixed-top">
        <div class="container-fluid text-center">
            <a class="navbar-brand mx-auto" href="index.html">
                <img src="./assets/favicon1.png" alt="GreenSync Logo" width="40"> GreenSync
            </a>
        </div>
    </nav>
    
    <div class="login-wrapper">

        <div class="login-container">
            <h3 class="text-center">Login</h3>
            <form id="login-form" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" id="username" placeholder="Enter your username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success">Login</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p>Don't have an account? <a href="sign_up.html">Sign up here</a></p>
            </div>
        </div>

        <div class="image-container">
            <img src="./assets/snippet2.png" alt="map">
            <img src="./assets/snippet1.png" alt="dashboard">
        </div>
    </div>
</body>
</html>
